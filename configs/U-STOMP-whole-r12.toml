# U-STOMP-whole with one change: radius_ratio = 12 (occurrences up to 12 x the closest-pair distance; default 3) — bank size
name = "U-STOMP-whole-r12"
[data]
dataset = "U"
[bank]
backend = "STOMP"
params = { radius_ratio = 12 }
source = "whole"
random_fractions = [1.0]
[distance]
norm = "centred"
[score]
scorer = "nearest"
point = "max"
