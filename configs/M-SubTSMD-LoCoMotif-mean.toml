# SubTSMD (TSMD) with LoCoMotif per dimension, rho as in the univariate frozen config; SubTSMD defaults delta=0.5, average linkage (Louis, 2026-10-14)
name = "M-SubTSMD-LoCoMotif-mean"
[data]
dataset = "M"
[bank]
backend = "SubTSMD[LoCoMotif]/subset"
params = { rho = 0.6 }
source = "train"
random_fractions = [1.0]
[distance]
norm = "centred"
[score]
scorer = "nearest"
point = "mean"
